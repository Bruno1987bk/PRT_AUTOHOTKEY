name: Build RustySNES FULL Windows

on:
  push:
    branches: [rustysnes-full-build]
    paths:
      - "rustysnes-build/**"
      - ".github/workflows/build-rustysnes-full.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96
          target: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: RustySNES

      - name: Clone RustySNES source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/doublegate/RustySNES.git RustySNES
          Set-Location RustySNES
          git checkout 98f8d398020b8798b16076fae315960031c6b3b7

      - name: Apply FULL patch
        shell: pwsh
        run: |
          Set-Location RustySNES
          git apply ../rustysnes-build/rustysnes_full.patch

      - name: Build FULL Windows executable
        shell: pwsh
        run: |
          Set-Location RustySNES
          cargo build --release -p rustysnes-frontend --features "full,gpu-timing" --target x86_64-pc-windows-msvc

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "RustySNES/target/x86_64-pc-windows-msvc/release/rustysnes.exe" "dist/RustySNES_FULL.exe"
          Copy-Item "RustySNES/README.md" "dist/README.md"
          Copy-Item "RustySNES/LICENSE-MIT" "dist/LICENSE-MIT"
          Copy-Item "RustySNES/LICENSE-APACHE" "dist/LICENSE-APACHE"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RustySNES_FULL_Windows
          path: dist/
          if-no-files-found: error
